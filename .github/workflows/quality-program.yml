      - "전체 풀스택/control-plane-drf/api/models.py"
      - "전체 풀스택/control-plane-drf/api/migrations/**"
      - "전체 풀스택/control-plane-drf/api/management/commands/import_quality_evidence.py"
      - "전체 풀스택/control-plane-drf/api/tests/test_quality_evidence.py"

permissions:
  contents: read

jobs:
  reproducible-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install pytest Pillow usd-core httpx numpy trimesh pydantic pydantic-settings Django==5.2.16 djangorestframework==3.17.1 django-cors-headers==4.7.0
      - name: Unit contracts
        working-directory: 전체 풀스택
        run: python -m pytest python-worker/tests/test_quality_program.py python-worker/tests/test_quality_advanced.py python-worker/tests/test_comfyui_image_client.py python-worker/tests/test_image_semantic_seed.py -q
      - name: Internal quality evidence schema
        working-directory: 전체 풀스택/control-plane-drf
        env:
          DB_ENGINE: sqlite
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py test api.tests.test_quality_evidence --verbosity 1
      - name: Sync pinned public fixtures
        working-directory: 전체 풀스택
        run: python scripts/sync-quality-datasets.py --tier smoke
      - name: Run phases 1,2,3,4,6 smoke gates
        working-directory: 전체 풀스택
        run: python scripts/run-quality-program.py --tier smoke
      - name: Fail on smoke baseline regression
        working-directory: 전체 풀스택
        run: python scripts/compare-quality-baseline.py --contract quality/ci-baseline.json
      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-program-smoke
          path: |
            전체 풀스택/storage/quality-datasets/quality-datasets.lock.json
            전체 풀스택/storage/quality-program/**
            전체 풀스택/storage/quality-results/baseline-diff/**
