      - "전체 풀스택/scripts/run-image-semantic-verifier.py"
      - "전체 풀스택/scripts/run-image-semantic-verifier.ps1"
      - "전체 풀스택/scripts/smoke-image-semantic-routing.py"
      - "전체 풀스택/quality/advanced-baseline.json"
      - "전체 풀스택/control-plane-drf/api/models.py"
      - "전체 풀스택/control-plane-drf/api/migrations/**"
      - "전체 풀스택/control-plane-drf/api/management/commands/import_quality_evidence.py"
      - "전체 풀스택/control-plane-drf/api/tests/test_quality_evidence.py"
      - ".github/workflows/quality-program.yml"
  pull_request:
    paths:
      - "전체 풀스택/quality/**"
      - "전체 풀스택/scripts/sync-quality-datasets.py"
      - "전체 풀스택/scripts/run-quality-program.py"
      - "전체 풀스택/scripts/benchmark-local-images.py"
      - "전체 풀스택/scripts/benchmark-public-cad.py"
      - "전체 풀스택/scripts/score-geneval-owlvit.py"
      - "전체 풀스택/scripts/quality_metrics.py"
      - "전체 풀스택/scripts/analyze-evaluation-reliability.py"
      - "전체 풀스택/scripts/benchmark-image-holdout.py"
      - "전체 풀스택/scripts/compare-image-ab.py"
      - "전체 풀스택/scripts/select-image-route.py"
      - "전체 풀스택/scripts/compare-quality-baseline.py"
      - "전체 풀스택/python-worker/app/image_precision.py"
      - "전체 풀스택/python-worker/app/openai_image_client.py"
      - "전체 풀스택/quality/ci-baseline.json"
      - "전체 풀스택/python-worker/tests/test_quality_program.py"
      - "전체 풀스택/python-worker/tests/test_quality_advanced.py"
      - "전체 풀스택/python-worker/tests/test_comfyui_image_client.py"
      - "전체 풀스택/python-worker/tests/test_image_semantic_seed.py"
      - "전체 풀스택/scripts/run-image-semantic-verifier.py"
      - "전체 풀스택/scripts/run-image-semantic-verifier.ps1"
