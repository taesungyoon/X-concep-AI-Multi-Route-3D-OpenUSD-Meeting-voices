services:
  ollama-proxy:
    build:
      context: ./infra/ollama-proxy
    network_mode: host
    environment:
      OLLAMA_PROXY_BIND_HOST: ${OLLAMA_PROXY_BIND_HOST:-172.17.0.1}
      OLLAMA_PROXY_TOKEN: ${OLLAMA_PROXY_TOKEN:?Set OLLAMA_PROXY_TOKEN}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null
          --header="Authorization: Bearer $${OLLAMA_PROXY_TOKEN}"
          "http://$${OLLAMA_PROXY_BIND_HOST}:11435/api/tags"
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  python-worker:
    build:
      args:
        INSTALL_OPENSCAD: "true"
        INSTALL_SPEECH: "true"
    environment:
      PIPELINE_MODE: ${PIPELINE_MODE:-local}
      LLM_MODE: openai_compatible
      VLLM_BASE_URL: http://host.docker.internal:11435/v1
      VLLM_API_KEY: ${OLLAMA_PROXY_TOKEN:?Set OLLAMA_PROXY_TOKEN}
      GEMMA_MODEL_NAME: ${OLLAMA_MODEL:-qwen3:14b}
      OPENSCAD_MODE: auto
      OPENAI_IMAGE_MODE: ${OPENAI_IMAGE_MODE:-mock}
      COMFYUI_BASE_URL: ${COMFYUI_BASE_URL:-http://host.docker.internal:8188}
      COMFYUI_API_KEY: ${COMFYUI_API_KEY:-}
      SHAPE_MODE: ${SHAPE_MODE:-mock}
      SHAPE_PROVIDER: ${SHAPE_PROVIDER:-triposr}
      SHAPE_API_URL: ${SHAPE_API_URL:-http://host.docker.internal:8081}
      SHAPE_API_KEY: ${SHAPE_API_KEY:-}
      SHAPE_TIMEOUT_SECONDS: ${SHAPE_TIMEOUT_SECONDS:-1800}
      SPEECH_MODE: faster_whisper
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3-turbo}
      WHISPER_MODEL_CACHE: /app/storage/models/whisper
      WHISPER_DEVICE: ${WHISPER_DEVICE:-auto}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-auto}
    depends_on:
      ollama-proxy: {condition: service_healthy}
