<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>X concep Omniverse RTX Viewer</title>
  <style>
    html,body,#app{margin:0;width:100%;height:100%;background:#050d16;color:white;font-family:Arial,sans-serif;overflow:hidden}
    #stream-video{display:block;width:100%;height:100%;object-fit:contain;outline:none;background:#050d16}
    #stream-audio{display:none}
    .overlay{position:fixed;left:18px;top:18px;z-index:5;background:#071725dd;border:1px solid #1f4d67;border-radius:12px;padding:12px;pointer-events:none}
    .overlay b{color:#2bc9e8}.overlay small{display:block;color:#8aa5b7;margin-top:5px}
  </style>
</head>
<body>
  <div class="overlay"><b>X concep AI · Omniverse RTX</b><small id="status">연결 준비 중</small></div>
  <video id="stream-video" tabindex="0" autoplay playsinline muted></video>
  <audio id="stream-audio" autoplay></audio>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
